name: CI_build

# Notepad++ XP edition: every build targets Windows XP (Win32 only).

on: [push, pull_request]

env:
  # YY-Thunks supplies the Windows Vista+ entry points that the modern MSVC
  # static CRT / STL need, so the v143 toolset can still produce XP binaries.
  # https://github.com/Chuyu-Team/YY-Thunks
  YY_THUNKS_VERSION: v1.2.2

jobs:
  build_xp:

    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_configuration: [Release, Debug]
        build_platform: [Win32]

    name: XP ${{ matrix.build_platform }} / ${{ matrix.build_configuration }} ${{ matrix.build_configuration == 'Release' && '(portable package)' || '(build + tests, no artifact)' }}

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Modify resource.h N++ version to avoid confusion
      working-directory: PowerEditor\src\
      shell: pwsh
      run: |
           $content = Get-Content -Path 'resource.h'
           $newContent = $content -replace 'TEXT\(\"Notepad\+\+ v.*\"\)', 'TEXT("Notepad++ GH_BUILD")'
           $newContent | Set-Content -Path 'resource.h'

    - name: Fetch YY-Thunks (Windows XP API thunks)
      shell: pwsh
      run: |
           $zip = Join-Path $env:RUNNER_TEMP 'YY-Thunks-Objs.zip'
           $url = "https://github.com/Chuyu-Team/YY-Thunks/releases/download/${{ env.YY_THUNKS_VERSION }}/YY-Thunks-Objs.zip"
           Write-Output "Downloading $url"
           Invoke-WebRequest -Uri $url -OutFile $zip
           Expand-Archive -Path $zip -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'YYThunks') -Force
           Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'YYThunks\objs') -Recurse -Filter '*.obj' | ForEach-Object { Write-Output "  $($_.FullName)" }

    - name: MSBuild of n++ exe
      working-directory: PowerEditor\visual.net\
      shell: pwsh
      run: |
           $thunks = (Resolve-Path (Join-Path $env:GITHUB_WORKSPACE 'YYThunks')).Path + '\'
           Write-Output "NppYYThunksRoot = $thunks"
           msbuild notepadPlus.sln /m /p:configuration="${{ matrix.build_configuration }}" /p:platform="${{ matrix.build_platform }}" /p:NppYYThunksRoot="$thunks"

    - name: Resolve the produced binary path
      shell: pwsh
      run: |
           if ('${{ matrix.build_configuration }}' -eq 'Release') {
             "NPP_BIN=PowerEditor\bin\Notepad++.exe" >> $env:GITHUB_ENV
           } else {
             "NPP_BIN=PowerEditor\visual.net\${{ matrix.build_configuration }}\Notepad++.exe" >> $env:GITHUB_ENV
           }

    - name: Verify Windows XP compatibility of the produced binary
      shell: pwsh
      run: |
           python tools/checkXpBinary.py "$env:NPP_BIN"

    - name: Run FunctionList and UrlDetection Tests (Debug only)
      if: matrix.build_configuration == 'Debug'
      shell: pwsh
      run: |
           Copy-Item "PowerEditor\visual.net\Debug\Notepad++.exe" -Destination "PowerEditor\bin"
           Copy-Item "PowerEditor\src\langs.model.xml" -Destination "PowerEditor\bin"
           Copy-Item "PowerEditor\src\stylers.model.xml" -Destination "PowerEditor\bin"
           Copy-Item "PowerEditor\installer\functionList" -Destination "PowerEditor\bin" -Recurse
           Copy-Item "PowerEditor\installer\xml4Config\doLocalConf.xml" -Destination "PowerEditor\bin"
           Copy-Item "PowerEditor\installer\filesForTesting\regexGlobalTest.xml" -Destination "PowerEditor\bin\functionList"
           Copy-Item "PowerEditor\installer\filesForTesting\overrideMap.xml" -Destination "PowerEditor\bin\functionList"

           cd .\PowerEditor\Test\FunctionList\
           .\unitTestLauncher.ps1
           if ($LastExitCode -ne 0) { $host.SetShouldExit($LastExitCode) }

           cd ..\UrlDetection
           .\verifyUrlDetection.ps1

    - name: Stage portable package (Release)
      if: matrix.build_configuration == 'Release'
      shell: pwsh
      run: |
           $ErrorActionPreference = 'Stop'
           $root  = $env:GITHUB_WORKSPACE
           $stage = Join-Path $root 'portable'

           if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
           New-Item -ItemType Directory -Path $stage | Out-Null

           # Main executable (the XP build we just produced and verified).
           Copy-Item (Join-Path $root $env:NPP_BIN) -Destination (Join-Path $stage 'notepad++.exe')

           # Resource directories. Sources live under PowerEditor\installer, except
           # userDefineLangs which ships preinstalled under PowerEditor\bin.
           # NOTE: plugins/ and updater/ are intentionally NOT bundled: they are
           # prebuilt binaries (plugin DLLs + GUP.exe) that are not XP-verified and
           # auto-update is meaningless on XP (disableNppAutoUpdate.xml is included).
           Copy-Item "PowerEditor\installer\APIs"            -Destination (Join-Path $stage 'autoCompletion') -Recurse
           Copy-Item "PowerEditor\installer\functionList"    -Destination (Join-Path $stage 'functionList')   -Recurse
           Copy-Item "PowerEditor\installer\nativeLang"      -Destination (Join-Path $stage 'localization')   -Recurse
           Copy-Item "PowerEditor\installer\themes"          -Destination (Join-Path $stage 'themes')         -Recurse
           Copy-Item "PowerEditor\bin\userDefineLangs"       -Destination (Join-Path $stage 'userDefineLangs')-Recurse

           # Root-level files. Use the src/ model XMLs (newest); bin/ copies are stale.
           Copy-Item "PowerEditor\src\langs.model.xml"               -Destination $stage
           Copy-Item "PowerEditor\src\stylers.model.xml"             -Destination $stage
           Copy-Item "PowerEditor\src\tabContextMenu_example.xml"    -Destination $stage
           Copy-Item "PowerEditor\src\toolbarButtonsConf_example.xml"-Destination $stage
           Copy-Item "PowerEditor\bin\change.log"                    -Destination $stage
           Copy-Item "PowerEditor\bin\readme.txt"                    -Destination $stage
           Copy-Item "PowerEditor\installer\xml4Config\doLocalConf.xml"            -Destination $stage
           Copy-Item "PowerEditor\installer\xml4Config\disableNppAutoUpdate.xml"  -Destination $stage
           Copy-Item "LICENSE" -Destination (Join-Path $stage 'license.txt')

           Write-Output "===== staged portable tree ====="
           Get-ChildItem $stage | Select-Object Name, Mode | Format-Table -AutoSize | Out-String -Width 120 | Write-Output

           # Zip it with the Windows-built-in bsdtar (tar.exe). Faster and more
           # reliable than Compress-Archive for this many small XML files, and no
           # third-party 7z dependency on the runner.
           $zip = Join-Path $root "NotepadPP.XP.Win32.portable.zip"
           if (Test-Path $zip) { Remove-Item -Force $zip }
           Push-Location $stage
           & tar.exe -a -cf $zip .
           Pop-Location
           if ($LASTEXITCODE -ne 0) { throw "tar.exe failed to create the portable zip" }
           "PORTABLE_ZIP=$zip" >> $env:GITHUB_ENV
           Write-Output "portable zip: $((Get-Item $zip).Length) bytes"

    - name: Archive portable package (Release)
      if: matrix.build_configuration == 'Release'
      uses: actions/upload-artifact@v7
      with:
          name: NotepadPP.XP.Win32.portable
          path: ${{ env.PORTABLE_ZIP }}
